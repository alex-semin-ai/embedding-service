name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra ann --extra report
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # the ann extra builds hnswlib, so its tests run here and are skipped on Windows
      - run: uv sync --frozen --extra ann --extra report
      - run: uv run pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bitesmart-recsys:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container with the offline hash embedder
        run: |
          docker run -d --name api -p 8000:8000 \
            -e BITESMART_EMBEDDER_BACKEND=hash -e BITESMART_MODEL_NAME=hash-embedder \
            -e BITESMART_INDEX_BACKEND=faiss_hnsw bitesmart-recsys:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz && break || sleep 2
          done
          curl -sf http://localhost:8000/v1/embeddings -H 'Content-Type: application/json' \
            -d '{"model":"hash-embedder","input":"greek yogurt"}' | head -c 200
          docker logs api | tail -5
