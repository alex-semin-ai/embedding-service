[project]
name = "bitesmart-recsys"
version = "0.1.0"
description = "OpenAI-compatible embeddings server with dynamic batching, vector index benchmark and a product substitution recommender."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "faiss-cpu>=1.8",
    "qdrant-client>=1.12",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "huggingface-hub>=0.24",
    "httpx>=0.27",
    "psutil>=5.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ann = ["hnswlib>=0.8"]
report = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "openai>=1.40",
    "types-PyYAML",
    "types-psutil",
]

[project.scripts]
bitesmart = "bitesmart_recsys.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitesmart_recsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=bitesmart_recsys --cov-report=term-missing --cov-fail-under=70"
markers = ["slow: needs the real model download or a live Qdrant server"]

[tool.coverage.run]
omit = ["src/bitesmart_recsys/cli.py", "src/bitesmart_recsys/bench/plots.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20", "N", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["faiss.*", "hnswlib.*", "onnxruntime.*", "tokenizers.*", "matplotlib.*"]
ignore_missing_imports = true
